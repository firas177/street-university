services:
  db:
    image: postgres:16
    container_name: streetu_db
    environment:
      POSTGRES_USER: streetu
      POSTGRES_PASSWORD: streetu_pw
      POSTGRES_DB: streetu
    ports:
      - "5432:5432"
    volumes:
      - streetu_pgdata:/var/lib/postgresql/data

  api:
    build: ./services/api
    container_name: streetu_api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL}
      AI_MODEL: ${AI_MODEL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Street University}
      ENABLE_TRANSFORMER_SENTIMENT: "true"
      SENTIMENT_CONFIDENCE_THRESHOLD: "0.70"
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - db

  web:
    build: ./apps/web
    container_name: streetu_web
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  streetu_pgdata:
  hf_cache: